name: sync-version

# Keep the landing page's eyebrow chip in sync with the latest
# vernier release tag. Runs hourly so a fresh release shows up on
# usevernier.com within an hour without any cross-repo secrets or
# manual touch-up. workflow_dispatch lets you trigger it
# immediately after publishing if you don't want to wait for the
# next cron tick.

on:
  schedule:
    # Every hour at :07 (avoid the top-of-hour rush GitHub Actions
    # schedulers face — actions/schedule explicitly recommends
    # staggering away from minute 0).
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Fetch latest vernier release tag
        id: tag
        env:
          # The default GITHUB_TOKEN can read the public vernier repo,
          # bumping the rate limit from 60/hr (anonymous) to 1000/hr.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh api repos/jondkinney/vernier/releases/latest --jq .tag_name)
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "couldn't resolve latest release tag" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest vernier release: $tag (version $version)"

      - name: Patch index.html if version drifted
        id: patch
        run: |
          new="${{ steps.tag.outputs.version }}"
          # The eyebrow chip is the only spot the version appears
          # ('v<semver> · Pre-alpha · ...'). Match the v prefix +
          # standard X.Y.Z semver explicitly so a stray '0.1.5'
          # anywhere else in the HTML doesn't get rewritten.
          old=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+ · Pre-alpha' index.html \
                | head -1 \
                | sed -E 's/^v([0-9.]+) ·.*/\1/')
          if [ -z "$old" ]; then
            echo "couldn't locate current version in index.html" >&2
            exit 1
          fi
          echo "site is at $old; latest release is $new"
          if [ "$old" = "$new" ]; then
            echo "already in sync"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s|v${old} · Pre-alpha|v${new} · Pre-alpha|g" index.html
          echo "changed=true"     >> "$GITHUB_OUTPUT"
          echo "old=$old"         >> "$GITHUB_OUTPUT"
          echo "new=$new"         >> "$GITHUB_OUTPUT"

      - name: Commit + push
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name  "vernier-release-bot"
          git config user.email "vernier-release-bot@users.noreply.github.com"
          git add index.html
          git commit -m "Bump landing-page version to v${{ steps.patch.outputs.new }}"
          git push origin main
